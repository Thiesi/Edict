name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Runs on main must finish: they deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: edict
          POSTGRES_PASSWORD: edict
          POSTGRES_DB: edict_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U edict"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: pgsql://edict:edict@127.0.0.1:5432/edict_test
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"           # matches Roanoke (PHP 8.3 + php-fpm)
          extensions: pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install the media tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libvips-tools libimage-exiftool-perl

      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer cs
      - run: composer stan
      - run: composer test

  # A real browser against the real app, because neither the editor nor the passkey
  # ceremony means anything until one has run them.
  browser:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: edict
          POSTGRES_PASSWORD: edict
          POSTGRES_DB: edict_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U edict"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: dev
      APP_URL: http://localhost:8080
      DATABASE_URL: pgsql://edict:edict@127.0.0.1:5432/edict_e2e
      E2E_ADMIN_PASSWORD: a throwaway password for ci
      DATA_DIR: ${{ runner.temp }}/edict-data
      MEDIA_MIN_FREE_BYTES: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium

      - name: Install the media tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libvips-tools

      - name: Create the database and the admin
        env:
          EDICT_ADMIN_PASSWORD: ${{ env.E2E_ADMIN_PASSWORD }}
        run: |
          php bin/edict migrate
          key=$(php bin/edict admin:create owner --no-ansi | sed -n 's/^Manual entry key: //p')
          test -n "$key"
          echo "E2E_TOTP_KEY=$key" >>"$GITHUB_ENV"

      - name: Run the media worker, as cron does when deployed
        run: |
          mkdir -p "$DATA_DIR"
          nohup sh -c 'while true; do php bin/edict worker --seconds=20; done' >"$RUNNER_TEMP/worker.log" 2>&1 &

      - run: npm run test:e2e

      - name: Show the worker's log
        if: failure()
        run: cat "$RUNNER_TEMP/worker.log"

      - name: Keep the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: .scratch/playwright/
          include-hidden-files: true
          retention-days: 7

  release:
    needs: [check, browser]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: edict
          POSTGRES_PASSWORD: edict
          POSTGRES_DB: edict_smoke
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U edict"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Test the deploy script
        run: sh tests/deploy/deploy_test.sh

      - name: Build the release
        run: sh scripts/build-release.sh "$GITHUB_SHA"

      - name: Smoke-test the release
        run: sh tests/deploy/smoke.sh ".scratch/release/edict-$GITHUB_SHA.tar.gz" pgsql://edict:edict@127.0.0.1:5432/edict_smoke

      - name: Upload the release
        uses: actions/upload-artifact@v4
        with:
          name: edict-${{ github.sha }}
          path: .scratch/release/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  # Staging only, and never for pull requests: this repository is public. The
  # environment also restricts the key to main.
  deploy-staging:
    needs: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      DEPLOY_TARGET: edictstg-deploy@roanoke.networkxxiii.de
    steps:
      # Pinned to a commit, because this job holds the deploy key. This is v4.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: edict-${{ github.sha }}
          path: ${{ runner.temp }}/release

      - name: Prepare SSH
        env:
          DEPLOY_KEY: ${{ secrets.EDICT_STAGING_DEPLOY_KEY }}
        run: |
          umask 077
          mkdir "$RUNNER_TEMP/ssh"
          printf '%s\n' "$DEPLOY_KEY" >"$RUNNER_TEMP/ssh/key"
          # Pinned, never scanned: this is Roanoke's public host key.
          echo 'roanoke.networkxxiii.de ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAK5ya0+YqAGmWL/7WDzh4BsxMuxchOSC3zvOoDQ9qHo' >"$RUNNER_TEMP/ssh/known_hosts"

      # The key can only run edict-deploy on the host, which reads the tarball from stdin.
      - name: Deploy
        run: |
          ssh -i "$RUNNER_TEMP/ssh/key" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
              "$DEPLOY_TARGET" deploy <"$RUNNER_TEMP/release/edict-$GITHUB_SHA.tar.gz"

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/ssh"
